<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Recaho Extender Settings</title>
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, Arial, sans-serif;
    background: #fff;
  }

  h1 {
    font-size: 15px;
    margin: 0 0 12px;
    color: #111827;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
  }

  input:focus {
    border-color: #32B4F1;
  }

  button {
    width: 100%;
    margin-top: 12px;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: #32B4F1;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  #status {
    margin-top: 8px;
    font-size: 12px;
    color: #16a34a;
    min-height: 14px;
  }
</style>
</head>
<body>

  <h1>🚚 Recaho Extender</h1>

  <label for="store-input">Store Name</label>
  <input id="store-input" type="text" placeholder="e.g. store-1" autocomplete="off">

  <button id="save-btn">Save</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
